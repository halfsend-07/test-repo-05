    - https://raw.githubusercontent.com/fullsend-ai/fullsend/
    - https://raw.githubusercontent.com/fullsend-ai/agents/
create_issues:
    allow_targets:
        repos:
            - halfsend-07/test-repo-05
            - fullsend-ai/fullsend
mint_url: https://bt-de5649d7-bt-mint.fullsend-ai.workers.dev
inference:
    project: it-gcp-konflux-e2e-fullsend
    wif_provider: projects/208332380190/locations/global/workloadIdentityPools/fullsend-inference/providers/gh-halfsend-07-test-repo-05
